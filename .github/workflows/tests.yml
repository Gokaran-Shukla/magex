name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sym]" pytest matplotlib
      - name: Run tests
        run: python -m pytest tests -q

  mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install
        run: pip install -e ".[mpi,sym]" pytest
      - name: MPI vs serial
        run: |
          python tests/mpi_check.py serial
          OMP_NUM_THREADS=1 mpirun --oversubscribe -n 2 python tests/mpi_check.py mpi
          python tests/mpi_check.py compare
