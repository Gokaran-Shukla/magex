name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sym,fast]" pytest
      - name: Run tests
        run: python -m pytest tests -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[fast]"
      - name: Smoke-run examples (shortened)
        run: |
          cd examples/micromag
          sed -i 's/^time_ns = .*/time_ns = 0.02/; s/^npts = .*/npts = 5/' sp4.toml pma_hysteresis.toml
          magex micromag sp4.toml
          magex micromag pma_hysteresis.toml
          magex micromag feGe_helix.toml
          cd ../spindyn
          sed -i 's/^steps = .*/steps = 500/; s/^therm_sweeps = .*/therm_sweeps = 50/; s/^meas_sweeps = .*/meas_sweeps = 100/' skyrmion_llg.toml cri3_mc.toml
          sed -i 's/anneal = .*//' skyrmion_llg.toml
          magex llg skyrmion_llg.toml
          magex mc cri3_mc.toml
          magex tc ../../validation_runs/CrI3_atomic_soc/results.json.gz
          magex gneb skyrmion_gneb.toml
          cd ../universal
          sed -i 's/^npts = .*/npts = 7/; s/^steps = .*/steps = 2000/; s/^meas = .*/meas = 100/; s/^therm = .*/therm = 50/' *.toml
          magex program hysteresis.toml
          magex program fmr.toml
          magex program cmc_anisotropy.toml
          magex program nanodot_dipolar.toml
          for t in vampire uppasd spirit; do magex export nanodot_dipolar.toml --to $t; done
          magex export micromag_mumax3_features.toml --to mumax3

  mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install
        run: pip install -e ".[mpi,sym]" pytest
      - name: MPI vs serial
        run: |
          python tests/mpi_check.py serial
          OMP_NUM_THREADS=1 mpirun --oversubscribe -n 2 python tests/mpi_check.py mpi
          python tests/mpi_check.py compare
