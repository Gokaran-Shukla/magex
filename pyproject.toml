[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magex"
version = "0.1.0"
description = "Green's-function magnetic exchange tensors, anisotropy, renormalised/downfolded J and LSWT magnons from Wannier90 Hamiltonians (MPI parallel)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gokaran Shukla"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy", "tomli; python_version < '3.11'"]
keywords = ["magnetic exchange", "DMI", "magnetic anisotropy", "Green's function", "Wannier90", "magnons"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
mpi = ["mpi4py"]
sym = ["spglib>=2"]
plot = ["matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Gokaran-Shukla/magex"
Issues = "https://github.com/Gokaran-Shukla/magex/issues"

[project.scripts]
magex = "magex.cli:main"

[tool.setuptools]
packages = ["magex"]
