[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magex"
version = "0.3.0"
description = "From Wannier90 Hamiltonians to devices: Green's-function exchange tensors, DMI and anisotropy, LSWT magnons, atomistic LLG spin dynamics, Monte Carlo T_C/T_N and finite-difference micromagnetics"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gokaran Shukla"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy", "matplotlib>=3.5", "pillow", "tomli; python_version < '3.11'"]
keywords = ["magnetic exchange", "DMI", "magnetic anisotropy", "Green's function", "Wannier90", "magnons", "spin dynamics", "LLG", "Monte Carlo", "Curie temperature", "micromagnetics", "skyrmions", "spin-orbit torque"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
mpi = ["mpi4py"]
sym = ["spglib>=2"]
plot = ["matplotlib"]
test = ["pytest"]
fast = ["numba"]

[project.urls]
Homepage = "https://github.com/Gokaran-Shukla/magex"
Issues = "https://github.com/Gokaran-Shukla/magex/issues"

[project.scripts]
magex = "magex.cli:main"

[tool.setuptools]
packages = ["magex", "magex.micromag"]

[tool.setuptools.package-data]
magex = ["py.typed"]
