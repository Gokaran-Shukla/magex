# Collapse barrier of an isolated atomistic skyrmion (GNEB) and its Arrhenius lifetime
#   magex gneb skyrmion_gneb.toml
[spinmodel]
model = {lattice = "triangular", a = 3.0, J = [2.0], D = 1.0, K = 0.2, moment = 3.0}
supercell = [30, 30, 1]
pbc = [true, true, false]

[gneb]
engine = "atomistic"
field = [0, 0, 6.0]                           # T: ferromagnet is the ground state, skyrmion metastable
initial = {type = "skyrmion", radius = 10.0}  # A; helicity chosen automatically from the DMI
final = {type = "uniform", direction = [0, 0, 1]}
images = 16
spring = 1.0
climbing = true
max_iter = 20000
temperature = 20.0                            # K, for the Arrhenius lifetime
attempt_time = 1e-11                          # s (typical 1e-12 ... 1e-9)
outdir = "skyrmion_gneb"
