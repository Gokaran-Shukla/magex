# Atomistic current-driven domain wall (Zhang-Li, beta = 2 alpha -> v = (beta/alpha) u)
[spinmodel]
model = {lattice = "chain", a = 3.0, J = [5.0], K = 0.5, moment = 2.0}
supercell = [200, 1, 1]
pbc = [false, false, false]

[structure]
materials = [{name = "bulk", Ku = [-0.1, [0, 1, 0]]}]      # hard axis y (Walker field)

[llg]
init = "domain"
texture = {normal = "x", position = 300.0, width = 5.0}
alpha = 0.1
dt = 0.004
steps = 40000
integrator = "depondt"
stt = {u = [40.0, 0, 0], beta = 0.2}
plane = "xz"
outdir = "zl_out"
